name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Depoda yalnızca gradlew.bat var; Linux için gradle-wrapper.properties ile aynı sürüm kurulur.
      - name: Test ve paketleme
        run: gradle test buildPlugin --console=plain
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Plugin Verifier (since/until aralığındaki IDE sürümleri)
        run: gradle verifyPlugin --console=plain
